server:
  port: 8081

spring:
  application:
    name: ms-utilisateur
  datasource:
    url: jdbc:postgresql://localhost:5432/db_utilisateur
    username: postgres
    password: passer
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/diplotrack

# Compte technique du service pour ouvrir les comptes dans Keycloak (F17).
# Le secret ne figure jamais dans le dépôt : il est lu depuis l'environnement.
keycloak:
  admin:
    base-url: http://localhost:8180
    realm: diplotrack
    client-id: diplotrack-admin-service
    client-secret: ${KEYCLOAK_ADMIN_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health