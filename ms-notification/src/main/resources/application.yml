server:
  port: 8085

spring:
  application:
    name: ms-notification
  datasource:
    url: jdbc:postgresql://localhost:5432/db_notification
    username: postgres
    password: passer
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/diplotrack

management:
  endpoints:
    web:
      exposure:
        include: health