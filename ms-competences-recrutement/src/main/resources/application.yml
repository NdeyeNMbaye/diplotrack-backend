server:
  port: 8084

spring:
  application:
    name: ms-competences-recrutement
  datasource:
    url: jdbc:postgresql://localhost:5432/db_competence_recrutement
    username: postgres
    password: passer
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/diplotrack

management:
  endpoints:
    web:
      exposure:
        include: health