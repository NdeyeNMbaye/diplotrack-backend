server:
  port: 8082

spring:
  application:
    name: ms-diplome
  datasource:
    url: jdbc:postgresql://localhost:5432/db_diplome
    username: postgres
    password: passer
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/diplotrack

management:
  endpoints:
    web:
      exposure:
        include: health