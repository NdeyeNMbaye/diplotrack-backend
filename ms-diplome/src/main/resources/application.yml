server:
  port: 8082

spring:
  application:
    name: ms-diplome

  # Base propre au service (Database-per-Service)
  datasource:
    url: jdbc:postgresql://localhost:5432/db_diplome
    username: postgres
    password: passer
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # le schéma est géré uniquement par Flyway
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Serveur SMTP : Mailpit en développement (port 1025, sans identifiant)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

  # Validation des jetons émis par Keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/diplotrack

# Paramètres applicatifs
app:
  mail:
    from: ${MAIL_FROM:noreply@diplotrack.isi.sn}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false            # /health ne doit pas tomber si le SMTP est arrêté